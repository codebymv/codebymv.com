<html lang="en">

    <meta property="og:image:width" content="1200" />

    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://codebymv.com/#website",
            "url": "https://codebymv.com/",
            "name": "codebymv",
            "description": "Matt Valentine is a full-stack developer based in Tucson, AZ, building interactive experiences for the web.",
            "publisher": { "@id": "https://codebymv.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://codebymv.com/#person",
            "name": "Matt Valentine",
            "url": "https://codebymv.com/",
            "email": "mailto:codebymv@gmail.com",
            "jobTitle": "Full-Stack Developer",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tucson",
              "addressRegion": "AZ",
              "addressCountry": "US"
            },
            "sameAs": [
              "https://github.com/codebymv",
              "https://x.com/codebymv"
            ]
          }
        ]
      }
    </script>
    <!-- Apply the theme before first paint so dark-mode users never see a
         white flash. Kept inline and tiny on purpose. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(t + '-theme');
          document.getElementById('meta-theme-color').setAttribute('content', t === 'dark' ? '#111213' : '#FAFAF7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify form detection -->
    <form name="portfolio-contact" action="/" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="hidden" name="form-name" value="portfolio-contact" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
