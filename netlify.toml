# Hashed Vite bundles (JS/CSS/fonts) - content-addressed, safe to cache forever
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Project media (mp4s/posters) - unhashed filenames that get replaced on
# re-capture, so cache for a day and serve stale while revalidating
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The HTML shell must always revalidate so deploys show up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
